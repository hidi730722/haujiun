<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>網拍經營中心</title>
<link rel="stylesheet" href="shared.css" />
<link rel="stylesheet" href="hub.css" />
</head>
<body>
  <header class="topbar">
    <div class="title-row">
      <h1>網拍經營中心</h1>
      <div class="header-actions">
        <span id="currentUser" class="current-user"></span>
        <a href="/app/account.html" class="btn-secondary link-btn">帳號設定</a>
        <button id="logoutBtn" class="btn-secondary">登出</button>
      </div>
    </div>
  </header>

  <main class="hub-main">
    <p class="hub-intro">選擇要使用的功能：</p>
    <div class="tile-grid">
      <a href="/app/product-selection/" class="tile">
        <div class="tile-icon">📋</div>
        <div class="tile-title">選品彙整系統</div>
        <div class="tile-desc">彙整即將上市與現有機型、關鍵字重點，標記選品與備註</div>
        <span class="tile-badge ready">可使用</span>
      </a>

      <a href="/app/image-style/" class="tile">
        <div class="tile-icon">🎨</div>
        <div class="tile-title">AI 生圖風格庫</div>
        <div class="tile-desc">依照過去生成圖片的風格，自動產生新商品的商品圖</div>
        <span class="tile-badge ready">可使用</span>
      </a>

      <div class="tile disabled">
        <div class="tile-icon">📈</div>
        <div class="tile-title">蝦皮廣告成效監控</div>
        <div class="tile-desc">追蹤廣告曝光、點擊、花費與轉換成效，異常自動提醒</div>
        <span class="tile-badge soon">規劃中</span>
      </div>

      <a href="/app/account.html" class="tile">
        <div class="tile-icon">⚙️</div>
        <div class="tile-title">帳號設定</div>
        <div class="tile-desc">修改密碼、查看已註冊的帳號清單</div>
        <span class="tile-badge ready">可使用</span>
      </a>
    </div>
  </main>

  <script>
    async function loadUser() {
      const res = await fetch('/auth/me');
      const data = await res.json();
      document.getElementById('currentUser').textContent = data.email || '';
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      location.href = '/login.html';
    });

    loadUser();
  </script>
</body>
</html>
