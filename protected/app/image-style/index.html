<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 生圖風格庫</title>
<link rel="stylesheet" href="/app/shared.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title-row">
      <h1>AI 生圖風格庫</h1>
      <div class="header-actions">
        <span id="currentUser" class="current-user"></span>
        <a href="/app/" class="btn-secondary link-btn">← 回主選單</a>
        <a href="/app/account.html" class="btn-secondary link-btn">帳號設定</a>
        <button id="logoutBtn" class="btn-secondary">登出</button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="panel">
      <h2>商品圖生成器</h2>
      <p class="panel-desc">上傳一張商品去背照，自動生成一整套不同用途的蝦皮商品圖（主圖、情境圖、細節圖…），可直接下載上架。</p>
      <div id="genMsg" class="message"></div>
      <div class="generate-form">
        <div class="field">
          <label for="productPhoto">商品去背照片</label>
          <input type="file" id="productPhoto" accept="image/png,image/jpeg,image/webp" />
        </div>
        <div class="field">
          <label for="productName2">商品名稱（選填）</label>
          <input type="text" id="productName2" placeholder="例如：iPhone 18 Pro 磁吸手機殼" />
        </div>
        <div class="field">
          <label for="genCount">要生成幾張？</label>
          <select id="genCount">
            <option value="2">2 張</option>
            <option value="3">3 張</option>
            <option value="4" selected>4 張</option>
            <option value="5">5 張</option>
            <option value="6">6 張</option>
            <option value="7">7 張</option>
            <option value="8">8 張</option>
          </select>
        </div>
        <div class="field">
          <label for="styleNote2">風格補充說明（選填）</label>
          <input type="text" id="styleNote2" placeholder="例如：淺藍色系、木質質感" />
        </div>
        <button type="button" id="generateSetBtn" class="btn-primary">🎨 自動生成商品圖組</button>
      </div>
      <div id="generateSetResult" class="generate-result"></div>
    </section>

    <section class="panel">
      <h2>生成紀錄</h2>
      <div id="historyGrid" class="thumb-grid"></div>
      <div id="historyEmpty" class="empty-state" hidden>還沒有生成紀錄</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
