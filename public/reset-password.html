<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>重設密碼 - 網拍經營中心</title>
<link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-card">
    <h1>重設密碼</h1>
    <p class="subtitle">請設定新密碼（至少 8 個字元）</p>
    <div id="msg" class="message"></div>
    <form id="resetForm">
      <div class="field">
        <label for="password">新密碼</label>
        <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirm">確認新密碼</label>
        <input id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary">重設密碼</button>
    </form>
    <div class="links">
      <a href="/login.html">返回登入</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('resetForm');
    const msg = document.getElementById('msg');
    const token = new URLSearchParams(location.search).get('token');

    if (!token) {
      msg.textContent = '缺少重設連結參數，請重新申請忘記密碼';
      msg.className = 'message error';
      form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        msg.textContent = '兩次輸入的密碼不一致';
        msg.className = 'message error';
        return;
      }
      const submitBtn = form.querySelector('button');
      submitBtn.disabled = true;
      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || '重設失敗';
          msg.className = 'message error';
          submitBtn.disabled = false;
          return;
        }
        msg.textContent = '密碼已重設成功，2 秒後導向登入頁';
        msg.className = 'message success';
        setTimeout(() => (location.href = '/login.html'), 2000);
      } catch (err) {
        msg.textContent = '連線失敗：' + err.message;
        msg.className = 'message error';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
