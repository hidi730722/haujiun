<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>忘記密碼 - 網拍經營中心</title>
<link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-card">
    <h1>忘記密碼</h1>
    <p class="subtitle">輸入你的 Email，我們會寄送重設密碼連結給你</p>
    <div id="msg" class="message"></div>
    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" />
      </div>
      <button type="submit" class="btn-primary">寄送重設連結</button>
    </form>
    <div class="links">
      <a href="/login.html">返回登入</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = form.querySelector('button');
      submitBtn.disabled = true;
      try {
        const res = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        const data = await res.json();
        msg.textContent = data.message || (res.ok ? '已送出' : data.error);
        msg.className = res.ok ? 'message success' : 'message error';
        if (res.ok) form.querySelector('button').textContent = '已寄出，請至信箱查看';
      } catch (err) {
        msg.textContent = '連線失敗：' + err.message;
        msg.className = 'message error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
